name: Weekly arXiv SLAM/Nav digest

on:
  workflow_dispatch:          # chạy tay từ tab Actions
  schedule:
    - cron: "0 13 * * 0"      # 13:00 UTC Chủ nhật = 20:00 giờ VN

permissions:
  contents: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch_arxiv.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data digest README.md
          git diff --cached --quiet || git commit -m "digest: $(date -u +%G-W%V)"
          git push
